name: Deploy

on:
  workflow_run:
    workflows: ["CI - Build & Test"]
    types: [completed]
    branches: [main]

run-name: "Deploy — ${{ github.event.workflow_run.display_title }}"

# Two deploys at once both run `npm ci` + vite build on a 2 GB droplet, which
# thrashes memory until the SSH action hits its command timeout. Serialise them.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # Only deploy if CI passed AND it was a push (not PR)
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build

      # The runner already built frontend/dist above. Ship that instead of
      # rebuilding on the droplet: a single vite build there now hangs for
      # 5+ minutes and times out the deploy (2 GB, no swap, shared with other
      # workloads). Nothing is compiled on the VPS.
      - name: Ship frontend build to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/root/frontend-dist-staging"
          strip_components: 2
          overwrite: true
          rm: true

      # The GCP service-account key is multi-line, so it cannot travel through the
      # ssh-action's `envs`. Materialise it as a file here and ship it — the value
      # never appears in a command line. A malformed secret fails the deploy now,
      # rather than reaching the server and breaking TTS silently.
      - name: Materialise GCP service-account key
        env:
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
        run: |
          printf '%s' "$GCP_SA_KEY_JSON" > gcp-key.json
          python3 -c "import json; json.load(open('gcp-key.json')); print('GCP key: valid JSON')"

      - name: Ship GCP key to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "gcp-key.json"
          target: "/root/staging"
          overwrite: true

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SECRET_KEY,DATABASE_URL,OPENAI_API_KEY,AZURE_SPEECH_KEY,AZURE_SPEECH_REGION
          script: |
            set -e
            cd /root/IELTS-Assist
            git fetch origin main
            git reset --hard origin/main

            # --- Runtime configuration (single source of truth: GitHub Secrets) ---
            # This file holds EVERY variable the backend reads. The systemd drop-in
            # installed below resets the unit's inline Environment= list, so these
            # values are the ones that actually apply — without which rotating a
            # secret in GitHub would be silently ignored.
            ENV_PATH=/root/IELTS-Assist/backend/.env
            # umask is scoped to this subshell — letting it leak previously made the
            # frontend files world-unreadable when they were copied into /var/www.
            (
              umask 077
              printf '%s\n' \
                "SECRET_KEY=${SECRET_KEY}" \
                "DATABASE_URL=${DATABASE_URL}" \
                "OPENAI_API_KEY=${OPENAI_API_KEY}" \
                "AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY}" \
                "AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION}" \
                "PYTHONUNBUFFERED=1" \
                "GOOGLE_APPLICATION_CREDENTIALS=/root/ielts-tts-key.json" \
                > "$ENV_PATH.tmp"
            )

            # Refuse to install a file with an empty SECRET_KEY — that would silently
            # leave the app on the insecure default.
            if ! grep -qE '^SECRET_KEY=.+$' "$ENV_PATH.tmp"; then
              echo "FATAL: SECRET_KEY missing or empty — is the GitHub Secret set?" >&2
              rm -f "$ENV_PATH.tmp"
              exit 1
            fi

            chmod 600 "$ENV_PATH.tmp"
            mv "$ENV_PATH.tmp" "$ENV_PATH"
            echo "Wrote $ENV_PATH ($(wc -l < "$ENV_PATH") entries)"

            # --- GCP service-account key, from its GitHub Secret ---
            # Validate the shipped copy before it replaces the working one.
            if python3 -c "import json; json.load(open('/root/staging/gcp-key.json'))" 2>/dev/null; then
              install -m 600 /root/staging/gcp-key.json /root/ielts-tts-key.json
              echo "Installed GCP service-account key"
            else
              echo "FATAL: shipped GCP key is not valid JSON" >&2
              exit 1
            fi

            # --- Make .env authoritative ---
            # An empty Environment= resets the list inherited from the base unit, so
            # its inline secrets stop applying. The base unit is never modified, so
            # rollback is simply deleting this file.
            # The empty ExecStart= clears the base unit's command so it can be
            # replaced without editing that file: production must not run uvicorn
            # with --reload, which keeps a file-watcher and a second process alive
            # on a 2 GB box for no benefit — the deploy restarts explicitly.
            DROPIN=/etc/systemd/system/ielts-backend.service.d
            mkdir -p "$DROPIN"
            printf '%s\n' \
              '[Service]' \
              'Environment=' \
              'EnvironmentFile=/root/IELTS-Assist/backend/.env' \
              'ExecStart=' \
              'ExecStart=/root/IELTS-Assist/backend/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000' \
              > "$DROPIN/override.conf"
            systemctl daemon-reload
            echo "Installed systemd drop-in; .env is authoritative, --reload dropped"

            # Backend
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt -q
            python -m pytest tests/ --tb=short -q
            # `|| true` matters: with `set -e`, a unit that fails to start would abort
            # the script here and skip the health check below — leaving the API down
            # with a bad drop-in installed and no revert.
            systemctl restart ielts-backend || echo "restart returned non-zero; health check will decide" >&2

            # --- Health check + automatic revert of the cutover ---
            # Runs immediately after the restart, before the frontend, so a failed
            # boot is caught and undone as fast as possible.
            sleep 3
            HEALTHY=0
            for i in 1 2 3 4 5; do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://127.0.0.1:8000/ || echo 000)
              if [ "$CODE" = "200" ]; then
                echo "Backend healthy (HTTP $CODE)"
                HEALTHY=1
                break
              fi
              sleep 3
            done

            if [ "$HEALTHY" != "1" ]; then
              echo "FATAL: backend unhealthy after restart" >&2
              journalctl -u ielts-backend -n 30 --no-pager >&2
              # Revert rather than leave the API down: dropping the override restores
              # the base unit's inline Environment= values.
              echo "Reverting systemd drop-in..." >&2
              rm -f "$DROPIN/override.conf"
              systemctl daemon-reload
              systemctl restart ielts-backend || true
              sleep 5
              curl -s -o /dev/null -w "after revert: HTTP %{http_code}\n" -m 5 http://127.0.0.1:8000/ >&2
              exit 1
            fi

            # Frontend — built in CI and shipped by the scp step above.
            # Never compiled here: this box cannot finish a vite build.
            if [ ! -f /root/frontend-dist-staging/index.html ]; then
              echo "FATAL: staged frontend missing — did the scp step run?" >&2
              exit 1
            fi
            # Keep the previous build so a half-finished swap can be undone. The
            # window between `rm -rf` and the copy completing is the only moment
            # the site can be broken, and previously nothing could restore it.
            WWW=/var/www/ielts-assist
            PREV=/root/www-previous
            rm -rf "$PREV" && mkdir -p "$PREV"
            cp -r "$WWW"/index.html "$WWW"/assets "$PREV"/ 2>/dev/null || true

            # Preserve audio/ (TTS-generated MP3s, incl. vocabulary pronunciations)
            mv "$WWW"/audio /tmp/ielts-audio-backup 2>/dev/null || true
            rm -rf "$WWW"/*
            cp -r /root/frontend-dist-staging/* "$WWW"/
            mv /tmp/ielts-audio-backup "$WWW"/audio 2>/dev/null || true
            chown -R www-data:www-data "$WWW"
            # Explicit modes so a stray umask can never make the site unreadable
            chmod -R u=rwX,go=rX "$WWW"

            # Verify the swap actually produced a servable site; restore if not.
            FE=$(curl -s -o /dev/null -w '%{http_code}' -m 10 -H "Host: annababy.cc" http://127.0.0.1/index.html || echo 000)
            if [ ! -f "$WWW/index.html" ] || [ "$FE" != "200" ]; then
              echo "FATAL: frontend broken after swap (index.html present? / HTTP $FE) — restoring" >&2
              rm -rf "$WWW"/index.html "$WWW"/assets
              cp -r "$PREV"/* "$WWW"/ 2>/dev/null || true
              chown -R www-data:www-data "$WWW"
              chmod -R u=rwX,go=rX "$WWW"
              exit 1
            fi
            echo "Frontend swap verified (HTTP $FE)"

            echo "Deploy complete!"
