name: Uptime

# Today's outage was found by a human loading the site. This is the cheapest
# possible fix: a scheduled job that fails when the site is unhealthy, so
# GitHub emails on failure. No third-party service, no signup, no credentials.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

# Queue overlapping runs; never cancel them. GitHub delays scheduled workflows
# under load, so with cancel-in-progress the newer run kills the older one — and
# a cancelled run reports as `failure`, which emailed a false alarm about a
# perfectly healthy site. A monitor that cries wolf gets ignored, which is worse
# than no monitor. Probes take well under a minute, so queuing costs nothing.
concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    name: Probe annababy.cc
    runs-on: ubuntu-latest
    steps:
      - name: Frontend responds
        env:
          ORIGIN: ${{ secrets.VPS_HOST }}
        run: |
          # curl already prints 000 via -w on a connection failure, so a `|| echo 000`
          # fallback concatenates into "000000". Swallow the exit code instead.
          probe_cf()     { curl -sS  -o /dev/null -w '%{http_code}' -m 20 https://annababy.cc/ 2>/dev/null || true; }
          # Same request, but straight at the droplet with correct SNI, so a
          # Cloudflare-side problem can be told apart from a dead origin.
          probe_origin() { curl -sSk -o /dev/null -w '%{http_code}' -m 20 \
                             --resolve "annababy.cc:443:$ORIGIN" https://annababy.cc/ 2>/dev/null || true; }

          CODE=$(probe_cf)
          echo "frontend via Cloudflare: HTTP $CODE"
          if [ "$CODE" = "200" ]; then exit 0; fi

          # Transient Cloudflare->origin blips are common and self-heal within
          # seconds. Alerting on a single sample made this monitor page about a
          # site that was serving fine, and an alert people learn to ignore is
          # worse than none. Confirm before escalating.
          echo "first probe failed ($CODE) — re-checking in 20s before alerting"
          sleep 20
          CODE2=$(probe_cf)
          echo "frontend via Cloudflare (retry): HTTP $CODE2"
          if [ "$CODE2" = "200" ]; then
            echo "::notice::Transient blip: first probe returned $CODE, retry returned 200. Not alerting."
            exit 0
          fi

          # Sustained failure. Which side is actually broken decides whether this
          # is worth waking someone for.
          ORIGIN_CODE=$(probe_origin)
          echo "origin direct: HTTP $ORIGIN_CODE"

          if [ "$ORIGIN_CODE" = "200" ]; then
            # Cloudflare is failing but the app is healthy. Nobody here can fix
            # Cloudflare's network, so emailing about it is pure noise — and a
            # monitor that cries wolf gets muted, taking the real alerts with it.
            # Surface it as a warning, visible in the Actions UI, without failing.
            echo "::warning::Cloudflare cannot reach the origin (got $CODE then $CODE2), but the origin serves 200 directly — the app is healthy. Usually a Cloudflare regional incident: check https://www.cloudflarestatus.com. Not alerting."
            exit 0
          fi

          echo "::error::ORIGIN DOWN: Cloudflare returned $CODE then $CODE2, and the origin itself returned $ORIGIN_CODE. The droplet is not serving — this one is actionable."
          exit 1

      - name: API and database respond
        run: |
          # /api/health pings Postgres and 503s if it is unreachable. nginx can
          # keep serving the static frontend while the backend or database is
          # dead — exactly the case a frontend-only check would miss.
          BODY=$(curl -sS -m 20 --retry 2 --retry-delay 5 https://annababy.cc/api/health || true)
          echo "api health: ${BODY:0:160}"
          echo "$BODY" | grep -q '"status":"healthy"' \
            || { echo "::error::API health check did not report healthy"; exit 1; }
          echo "$BODY" | grep -q '"database":"ok"' \
            || { echo "::error::API reports the database is unreachable"; exit 1; }

      - name: TLS certificates have runway
        env:
          ORIGIN: ${{ secrets.VPS_HOST }}
        run: |
          days_left() {  # $1 = host to connect to, $2 = SNI name
            local end
            end=$(echo | openssl s_client -servername "$2" -connect "$1:443" 2>/dev/null \
                  | openssl x509 -noout -enddate | cut -d= -f2)
            [ -n "$end" ] || { echo "could not read certificate from $1" >&2; return 1; }
            echo $(( ( $(date -d "$end" +%s) - $(date -u +%s) ) / 86400 ))
          }

          # The domain is proxied by Cloudflare, so connecting to the name gets
          # CLOUDFLARE's edge cert — which Cloudflare renews itself and was never
          # at risk. Checking only that would have missed the real incident.
          EDGE=$(days_left annababy.cc annababy.cc)
          echo "edge (Cloudflare) certificate: $EDGE days"
          [ "$EDGE" -ge 7 ] || { echo "::error::Cloudflare edge certificate expires in $EDGE days"; exit 1; }

          # The origin's own Let's Encrypt cert is the one that silently stopped
          # renewing for weeks (the firewall was blocking the HTTP-01 challenge)
          # and was 5 days from expiry when found by hand. Reached by connecting
          # to the origin IP directly with the right SNI.
          ORIGIN_DAYS=$(days_left "$ORIGIN" annababy.cc)
          echo "origin (Let's Encrypt) certificate: $ORIGIN_DAYS days"
          [ "$ORIGIN_DAYS" -ge 14 ] || { echo "::error::Origin certificate expires in $ORIGIN_DAYS days — check certbot and the DO firewall"; exit 1; }
