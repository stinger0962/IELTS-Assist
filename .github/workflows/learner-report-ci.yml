name: Learner Report CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/reports/**'
      - '.github/workflows/learner-report-ci.yml'

permissions:
  contents: read

jobs:
  report:
    name: Synthetic learner report (SQLite and Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install psycopg2-binary==2.9.9
      - name: Exercise the full report against disposable fixtures
        env:
          IELTS_TEST_POSTGRES_ALLOW_DISPOSABLE: '1'
          IELTS_TEST_POSTGRES_URL: postgresql+psycopg2://test_user:test_pass@127.0.0.1:5432/test_db
        run: python -m unittest discover -s ops/reports/tests -v
